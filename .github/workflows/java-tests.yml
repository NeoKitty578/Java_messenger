
name: Java Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Download JUnit dependencies
        run: |
          mkdir -p .github/test-libs
          curl -fL -o .github/test-libs/junit.jar \
            https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fL -o .github/test-libs/hamcrest.jar \
            https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Run JUnit tests
        run: |
          ant -noinput \
            -Dlibs.junit_4.classpath=.github/test-libs/junit.jar \
            -Dlibs.hamcrest.classpath=.github/test-libs/hamcrest.jar \
            test
